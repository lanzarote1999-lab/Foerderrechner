<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krankenkassen-Zuschussrechner</title>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:900px;
    margin:40px auto;
    padding:20px;
}

h1{
    text-align:center;
}

select{
    width:100%;
    max-width:500px;
    padding:12px;
    font-size:16px;
    margin:20px auto;
    display:block;
}

#rechner{
    margin-top:20px;
}

.button{
    display:inline-block;
    margin-top:20px;
    padding:12px 24px;
    background:#d97706;
    color:white;
    text-decoration:none;
    border-radius:8px;
}
</style>
</head>
<body>

<h1>Krankenkassen-Zuschussrechner</h1>

<p style="text-align:center;">
Wähle zuerst deinen Kurs aus.
</p>

<select id="kurs" onchange="ladeRechner()">
    <option value="">Bitte Kurs auswählen</option>
    <option value="KU-BE-JLS6VD">Pilates</option>
    <option value="KU-BE-B27NTW">8-Wochen Rückenfit Power Programm</option>
    <option value="KU-BE-8G4YWX">FaszienFokus: Das Beweglichkeits-Programm</option>
</select>

<div id="rechner"></div>

<div style="text-align:center;">
    <a class="button" href="https://DEINE-WEBSITE.DE">
        Jetzt Kursplatz sichern
    </a>
</div>

<script>
function ladeRechner() {

    const kursId = document.getElementById("kurs").value;

    if(!kursId){
        document.getElementById("rechner").innerHTML = "";
        return;
    }

    document.getElementById("rechner").innerHTML = `
        <iframe
        src="https://zpp-konzepte.de/courses/rechner/embed?preis=140&kursId=${kursId}&color=d97706"
        width="100%"
        height="350"
        frameborder="0">
        </iframe>
    `;
}
</script>

</body>
</html>
